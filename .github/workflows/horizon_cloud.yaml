name: Horizon scheduled monitor

on:
  push:
    branches: [main]
    paths: [.github/workflows/horizon_cloud.yaml]
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe reads questions; dry-run forecasts privately; publish submits validated forecasts'
        type: choice
        options: [observe, dry-run, publish]
        default: observe

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: horizon-production-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bc59773a033a1c26ddafefc4bd43303bd7a4118
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline tests
        run: python -m unittest discover -s tests
      - name: Install runtime dependencies
        run: python -m pip install asknews==0.13.11 httpx==0.28.1
      - name: Check questions and run selected mode
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          HORIZON_NOTIFY: 'true'
          HORIZON_MODE: ${{ inputs.mode || vars.HORIZON_MODE || 'observe' }}
        run: python -m horizon.cloud --mode "$HORIZON_MODE"
      - name: Persist operational state
        uses: actions/upload-artifact@v4
        with:
          name: horizon-operational-state
          path: work/cloud-export/*
          if-no-files-found: error
          retention-days: 90
