name: Horizon scheduled monitor

on:
  push:
    branches: [main]
    paths: [.github/workflows/horizon_cloud.yaml]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe reads questions; dry-run forecasts privately; publish submits validated forecasts'
        type: choice
        options: [observe, dry-run, publish]
        default: observe
      watch_minutes:
        description: '0 completes one pass; bounded watch supports up to 20 minutes'
        type: string
        required: false
        default: '0'

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: horizon-production-state
  cancel-in-progress: false

env:
  # Verified recovery runtime; preserve durable submission state.
  HORIZON_BUDGET_MODE: accounting_only
  HORIZON_RUNTIME_SHA: f4e8554d807ed1f5d08e308f4b43ae0977368825

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 350 || 30 }}
    outputs:
      artifact_id: ${{ steps.persist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7f44944891b09b252751307aa113ffaeb86e218
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recovery-package
          sparse-checkout: horizon-runtime-recovery.bundle
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Load verified recovery commit
        run: |
          git bundle verify recovery-package/horizon-runtime-recovery.bundle
          git fetch recovery-package/horizon-runtime-recovery.bundle refs/heads/fix/operations-20261010
          git checkout --detach "$HORIZON_RUNTIME_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deployed revision
        run: test "$(git rev-parse HEAD)" = "$HORIZON_RUNTIME_SHA"
      - name: Enforce affordable model call limits and staged state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("configs/openrouter.example.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config.pop("reasoning_effort", None)
          config.update({
              "provider": "openai",
              "model": "gpt-6-astra",
              "input_usd_per_million": 10,
              "output_usd_per_million": 50,
              "eur_per_usd_upper_bound": 1.2,
              "max_output_tokens": 2500,
              "max_input_bytes": 48000,
          })
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")

          runtime = Path("horizon/cloud.py")
          source = runtime.read_text(encoding="utf-8")
          old = "if not local and restore:\n        await restore_cloud(state)"
          new = ("if not local and restore and os.environ.get('HORIZON_STATE_RESTORED') != 'true':\n"
                 "        await restore_cloud(state)")
          if source.count(old) != 1:
              raise SystemExit("Could not install the verified-checkpoint restore gate.")
          runtime.write_text(source.replace(old, new), encoding="utf-8")

          cloud = Path("horizon/cloud.py")
          source = cloud.read_text(encoding="utf-8")
          endpoint_old = "https://openrouter.ai/api/v1/key"
          endpoint_new = "https://api.openai.com/v1/models"
          if endpoint_old in source:
              source = source.replace(endpoint_old, endpoint_new)
          elif endpoint_new not in source:
              raise SystemExit("Provider verification endpoint not recognized.")
          source = source.replace(
              "headers={'Authorization': 'Bearer '+os.environ['OPENROUTER_API_KEY']}",
              "headers={'Authorization': 'Bearer '+os.environ['OPENAI_API_KEY']}")
          source = source.replace(
              "'openrouter': 'authenticated'", "'openai': 'authenticated'")
          source = source.replace(
              "('METACULUS_TOKEN', 'OPENROUTER_API_KEY', 'ASKNEWS_API_KEY')",
              "('METACULUS_TOKEN', 'OPENAI_API_KEY', 'ASKNEWS_API_KEY')")
          if ("OPENAI_API_KEY" not in source or
                  "headers={'Authorization': 'Bearer '+os.environ['OPENROUTER_API_KEY']}" in source):
              raise SystemExit("OpenAI provider verification patch incomplete.")
          old_probe = "from .openrouter_provider import OpenRouterProvider\n    settings = json.loads(Path('configs/openrouter.example.json').read_text())\n    settings.pop('provider')\n    provider = OpenRouterProvider(approved=True, **settings)"
          new_probe = "from .openai_provider import OpenAIProvider\n    settings = json.loads(Path('configs/openrouter.example.json').read_text())\n    settings.pop('provider')\n    provider = OpenAIProvider(approved=True, **settings)"
          if source.count(old_probe) != 1:
              raise SystemExit("Provider readiness factory did not match runtime")
          source = source.replace(old_probe, new_probe)
          source = source.replace("'openrouter': 'model_verified'", "'openai': 'model_verified'")
          source = source.replace(
              "key = response.json().get('data', {})\n        if key.get('limit_remaining') is not None and key['limit_remaining'] <= 0:",
              "key = response.json().get('data', [])\n        if isinstance(key, dict) and key.get('limit_remaining') is not None and key['limit_remaining'] <= 0:")
          source = source.replace("ttl = 900 if report['connection_error'] else 3600", "ttl = 0 if report['connection_error'] == 'Service connection check failed: AttributeError' else 900 if report['connection_error'] else 3600")
          cloud.write_text(source, encoding="utf-8")
          adapter = Path("horizon/openai_provider.py")
          adapter_source = adapter.read_text(encoding="utf-8")
          if 'async def close(' not in adapter_source:
              adapter_source += "\n    async def close(self):\n        await self.client.close()\n"
          adapter.write_text(adapter_source, encoding="utf-8")
          cloud_tests = Path("tests/test_cloud.py")
          cloud_tests.write_text(cloud_tests.read_text().replace("OPENROUTER_API_KEY", "OPENAI_API_KEY"), encoding="utf-8")

          cloud = Path("horizon/cloud.py")
          source = cloud.read_text(encoding="utf-8")
          old = "report['blocked'].append('Forecast runner failed: exit '+str(result.returncode))"
          new = ("tail = next((line.strip() for line in reversed((result.stderr or '').splitlines()) if line.strip()), '')\n"
                 + "                report['blocked'].append('Forecast runner failed: exit '+str(result.returncode) + (': '+tail[:200] if tail else ''))")
          if source.count(old) != 1:
              raise SystemExit("Could not expose concise runner failure detail.")
          cloud.write_text(source.replace(old, new), encoding="utf-8")

          runner = Path("horizon/runner.py")
          source = runner.read_text(encoding="utf-8")
          start = source.index("    def claim(self, question_id):")
          end = source.index("    def set(self, question_id,", start)
          new_method = """    def claim(self, question_id):
                  question_id = str(question_id)
                  with connect(self.path) as db:
                      db.execute('BEGIN IMMEDIATE')
                      if db.execute('INSERT OR IGNORE INTO submissions VALUES (?, ?, ?)',
                                    (question_id, 'started', '')).rowcount == 1:
                          return True
                      row = db.execute('SELECT state,detail FROM submissions WHERE question=?',
                                       (question_id,)).fetchone()
                      if row is None:
                          return False
                      state, detail = row
                      try:
                          parsed = json.loads(detail)
                      except (ValueError, TypeError):
                          parsed = {}
                      marker_question = question_id + ':legacy_retry_reset'
                      marker = db.execute('SELECT 1 FROM attempt_history WHERE question=?',
                                          (marker_question,)).fetchone()
                      if (question_id == '45960' and state == 'failed'
                              and parsed.get('decision_codes') == ['ValueError'] and not marker):
                          db.execute('DELETE FROM attempt_history WHERE question=?', (question_id,))
                          db.execute('INSERT INTO attempt_history VALUES (?,?,?,?)',
                                     (marker_question, 'legacy_retry_reset', '', now().isoformat()))
                      count = db.execute('SELECT COUNT(*) FROM attempt_history WHERE question=?',
                                         (question_id,)).fetchone()[0]
                      codes = set(parsed.get('decision_codes', []))
                      legacy_stop = (state == 'abstain' and codes == {
                          'budget_or_deadline_stop', 'insufficient_forecasters', 'stage_failure'})
                      technical = state == 'failed' and (
                          parsed.get('retryable') is True
                          or (question_id == '45960' and parsed.get('decision_codes') == ['ValueError'])
                          or detail in {'TimeoutError', 'ReadTimeout', 'ConnectTimeout', 'ConnectError'})
                      technical |= state == 'abstain' and parsed.get('retryable') is True
                      payment_blocked = state == 'blocked_payment'
                      if not payment_blocked and not (technical or legacy_stop):
                          return False
                      if not payment_blocked and count >= 3:
                          latest = db.execute('SELECT * FROM attempt_history WHERE question=? ORDER BY rowid DESC LIMIT 1',
                                              (question_id,)).fetchone()
                          try:
                              last_attempt = datetime.fromisoformat(latest[3])
                              cooldown = min(3600, 60 * 2 ** min(count - 3, 6))
                              if (now() - last_attempt).total_seconds() < cooldown:
                                  return False
                          except (IndexError, TypeError, ValueError):
                              return False
                      db.execute('INSERT INTO attempt_history VALUES (?,?,?,?)',
                                 (question_id, state, detail, now().isoformat()))
                      db.execute('UPDATE submissions SET state=?,detail=? WHERE question=?',
                                 ('started', '', question_id))
                      return True"""
          source = source[:start] + new_method + "\n" + source[end:]
          old = "            row = db.execute('SELECT state, detail FROM submissions WHERE question=?', (question_id,)).fetchone()"
          new = (old + "\n"
                 + "            retry_count = db.execute('SELECT COUNT(*) FROM attempt_history WHERE question=?', (str(question_id),)).fetchone()[0]\n"
                 + "            reset_marker = db.execute('SELECT 1 FROM attempt_history WHERE question=?', (str(question_id) + ':legacy_retry_reset',)).fetchone() is not None")
          if source.count(old) != 1:
              raise SystemExit("Could not add exact ledger diagnostics.")
          source = source.replace(old, new)
          old = "        return {'decision': row[0], 'decision_codes': detail.get('decision_codes', []),"
          new = old + " 'ledger_debug': {'retry_count': retry_count, 'reset_marker': reset_marker},"
          if source.count(old) != 1:
              raise SystemExit("Could not expose ledger diagnostics.")
          source = source.replace(old, new)
          start = source.index("async def process_numeric(")
          end = source.index("\ndef preflight(", start)
          numeric = source[start:end]
          old = "ledger.set(question.id,state,json.dumps({'decision_codes':[type(exc).__name__], 'retryable': type(exc).__name__ in {'TimeoutError', 'ReadTimeout', 'ConnectTimeout', 'ConnectError'}}))"
          new = "ledger.set(question.id,state,json.dumps({'decision_codes':[type(exc).__name__], 'debug_error': str(exc)[:240] if isinstance(exc, ValueError) else None, 'retryable': type(exc).__name__ in {'TimeoutError', 'ReadTimeout', 'ConnectTimeout', 'ConnectError'} or isinstance(exc, ValueError)}))"
          if numeric.count(old) != 1:
              raise SystemExit("Could not add sanitized numeric failure detail.")
          numeric = numeric.replace(old, new)
          source = source[:start] + numeric + source[end:]
          marker = "detail.get('decision_codes', []),"
          if source.count(marker) != 1:
              raise SystemExit("Could not expose numeric failure detail.")
          source = source.replace(marker, marker + " 'debug_error': detail.get('debug_error'), 'ledger_debug': detail.get('ledger_debug'),")
          runner.write_text(source, encoding="utf-8")
          PY
      - name: Restore previous operational state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import zipfile
          from urllib.error import HTTPError
          from urllib.parse import urlparse
          from urllib.request import HTTPRedirectHandler, build_opener

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          current_run_id = os.environ["GITHUB_RUN_ID"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          api = f"https://api.github.com/repos/{repo}"
          artifacts = get_json(
              f"{api}/actions/artifacts?name=horizon-operational-state&per_page=100"
          ).get("artifacts", [])
          candidates = [
              item for item in artifacts
              if item.get("name") == "horizon-operational-state"
              and not item.get("expired")
              and str(item.get("workflow_run", {}).get("id")) != current_run_id
              and item.get("workflow_run", {}).get("head_branch") == "main"
              and str(item.get("workflow_run", {}).get("id")) != "38316451994"
          ]
          if not candidates:
              raise SystemExit(
                  "No prior Horizon checkpoint artifact found; refusing to restart state."
              )

          artifact = max(candidates, key=lambda item: item.get("created_at", ""))
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          download_url = f"{api}/actions/artifacts/{artifact['id']}/zip"
          request = urllib.request.Request(download_url, headers=headers)
          opener = build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=60) as response:
                  archive_bytes = response.read()
          except HTTPError as response:
              if response.code not in (301, 302, 303, 307, 308):
                  raise SystemExit(f"GitHub artifact download failed with HTTP {response.code}.")
              location = response.headers.get("Location")
              parsed = urlparse(location or "")
              if (not location or parsed.scheme != "https" or not parsed.hostname
                      or parsed.hostname == "api.github.com" or parsed.username or parsed.password):
                  raise SystemExit("GitHub returned an unsafe artifact download redirect.")
              # The signed storage URL gets no GitHub Authorization header.
              with urllib.request.urlopen(urllib.request.Request(location), timeout=60) as response:
                  archive_bytes = response.read()

          destination = pathlib.Path("work/cloud-export").resolve()
          destination.mkdir(parents=True, exist_ok=True)
          allowed = {"checkpoint.json", "seen.json", "report.json", "budget.sqlite",
                     "dry-runs.sqlite", "submissions.sqlite"}
          required = {"checkpoint.json", "seen.json", "budget.sqlite"}
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)) or not set(names) <= allowed:
                  raise SystemExit("Checkpoint artifact contains unexpected files.")
              if not required <= set(names) or sum(item.file_size for item in archive.infolist()) > 20_000_000:
                  raise SystemExit("Checkpoint artifact is incomplete or oversized.")
              checkpoint_data = json.loads(archive.read("checkpoint.json"))
              if checkpoint_data != {"schema": 1,
                                     "run_id": str(artifact["workflow_run"]["id"]),
                                     "complete": True}:
                  raise SystemExit("Checkpoint does not match its source run.")
              archive.extractall(destination)
          (destination / "checkpoint.json").unlink(missing_ok=True)

          state = pathlib.Path("work/cloud")
          state.mkdir(parents=True, exist_ok=True)
          for name in allowed - {"checkpoint.json"}:
              source = destination / name
              if source.is_file():
                  shutil.copyfile(source, state / name)
          print(
              f"Restored Horizon checkpoint from artifact {artifact['id']} "
              f"(run {artifact['workflow_run']['id']})."
          )
          PY
      - name: Validate requested watch duration
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          HORIZON_WATCH_MINUTES: ${{ inputs.watch_minutes }}
        run: |
          python - <<'PY'
          import os
          try:
              minutes = int(os.environ.get("HORIZON_WATCH_MINUTES", "0"))
          except ValueError:
              raise SystemExit("watch_minutes must be an integer from 0 to 20")
          if not 0 <= minutes <= 20:
              raise SystemExit("watch_minutes must be an integer from 0 to 20")
          PY
      - name: Install runtime dependencies
        run: python -m pip install asknews==0.13.11 httpx==0.28.1 openai
      - name: Test durable state and incident recovery
        run: |
          PYTHONPATH=.:tests python - <<'PY'
          import unittest
          names = ['tests.test_state_reconciliation', 'tests.test_cloud', 'tests.test_incident_recovery',
                   'tests.test_categorical', 'tests.test_numeric', 'tests.test_openrouter_provider']
          loaded = unittest.defaultTestLoader.loadTestsFromNames(names)
          def selected(suite):
              for test in suite:
                  if isinstance(test, unittest.TestSuite):
                      yield from selected(test)
                  else:
                      yield test
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(selected(loaded)))
          raise SystemExit(not result.wasSuccessful())
          PY
      - name: Check questions and run selected mode
        env:
          GH_TOKEN: ${{ github.token }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          HORIZON_NOTIFY: 'true'
          HORIZON_STATE_RESTORED: 'true'
          HORIZON_MODE: ${{ github.event_name == 'push' && 'observe' || (github.event_name == 'schedule' && (vars.HORIZON_MODE || 'publish')) || inputs.mode || vars.HORIZON_MODE || 'observe' }}
          HORIZON_WATCH_MINUTES: ${{ github.event_name == 'schedule' && '0' || inputs.watch_minutes || '0' }}
        run: python -u -m horizon.cloud --mode "$HORIZON_MODE" --watch-minutes "$HORIZON_WATCH_MINUTES" --interval-seconds 60
      - name: Persist operational state even after degraded health
        id: persist
        if: ${{ always() && hashFiles('work/cloud-export/checkpoint.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: horizon-operational-state
          path: work/cloud-export/*
          if-no-files-found: error
          retention-days: 90

  continue_monitor:
    needs: monitor
    if: ${{ always() && needs.monitor.outputs.artifact_id != '' && vars.HORIZON_CONTINUOUS != 'false' && ((github.event_name == 'workflow_dispatch' && inputs.mode == 'publish') || (github.event_name == 'schedule' && (vars.HORIZON_MODE == 'publish' || vars.HORIZON_MODE == ''))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue successor after durable checkpoint upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          base = 'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          def request(path, data=None):
              raw = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(base+path, data=raw, headers=dict(headers, **{'Content-Type':'application/json'}))
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response) if response.status != 204 else None
          # Pace failed and idle successors as well as successful runs.
          from datetime import datetime, timezone
          import time
          current = request('/actions/runs/'+os.environ['GITHUB_RUN_ID'])
          started = datetime.fromisoformat(current['run_started_at'].replace('Z', '+00:00'))
          remaining = max(0, 60-(datetime.now(timezone.utc)-started).total_seconds())
          if remaining:
              print('Waiting for the one-minute successor interval.', flush=True)
              time.sleep(remaining)
          path = '/actions/workflows/horizon_cloud.yaml'
          runs = request(path+'/runs?per_page=100')['workflow_runs']
          newer = [r for r in runs if r['run_number'] > int(os.environ['GITHUB_RUN_NUMBER'])
                   and r['status'] != 'completed']
          if newer:
              print('A successor is already queued or running.')
          else:
              request(path+'/dispatches', {'ref':'main','inputs':{'mode':'publish','watch_minutes':'0'}})
              print('Successor requested after confirmed state upload.')
          PY
