name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
    inputs:
      watch_minutes:
        description: "How long to keep polling (1 = a single pass)"
        default: "1"
  schedule:
    # GitHub fires this "hourly" cron only every ~8h for this repo, so cron alone
    # left 1-3h unwatched after every 5h45m run (Nov 12-13: about 30% of the
    # time). Each watch run therefore queues its own successor in the last step;
    # the cron is only the backstop that restarts the chain if it ever breaks.
    - cron: "7 * * * *"

permissions:
  contents: read
  actions: write # lets a run queue the next one

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 355
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          end=$(( $(date +%s) + ${WATCH_MINUTES:-345} * 60 ))
          while :; do
            poetry run python main.py || echo "::warning::bot pass failed, retrying next poll"
            [ $(( $(date +%s) + 600 )) -ge $end ] && break
            sleep 600
          done
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          WATCH_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.watch_minutes || '345' }}
          TEMPLATE_FALLBACK_HOURS: ${{ vars.TEMPLATE_FALLBACK_HOURS }}
          TEMPLATE_LAST_CALL_HOURS: ${{ vars.TEMPLATE_LAST_CALL_HOURS }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }} # same key Horizon verified
      # Keep watching without waiting for the next cron. A manually cancelled run
      # does not queue a successor, and a single-pass manual run does not either.
      - name: Queue the next watch
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.watch_minutes != '1') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run_bot_on_tournament.yaml --repo "$GITHUB_REPOSITORY" --ref main -f watch_minutes=345
