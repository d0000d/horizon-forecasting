name: Horizon release verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/horizon_diagnostics.yaml, horizon-runtime-recovery.bundle]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HORIZON_BUDGET_MODE: accounting_only
      HORIZON_RUNTIME_SHA: cfa1a62cd3390739a64a9303d835c52dd475ab6b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b7f44944891b09b252751307aa113ffaeb86e218
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recovery-package
          sparse-checkout: horizon-runtime-recovery.bundle
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify release bundle
        run: |
          git bundle verify recovery-package/horizon-runtime-recovery.bundle
          git fetch recovery-package/horizon-runtime-recovery.bundle refs/heads/fix/retry-deadline-20261005
          git checkout --detach "$HORIZON_RUNTIME_SHA"
          test "$(git rev-parse HEAD)" = "$HORIZON_RUNTIME_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx==0.28.1
      - name: Verify categorical, numeric and durable state regressions
        run: PYTHONPATH=.:tests python -m unittest tests.test_categorical tests.test_numeric tests.test_state_reconciliation tests.test_cloud tests.test_incident_recovery
      - name: Diagnose model billing without exposing credentials or balances
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, httpx
          headers = {'Authorization': 'Bearer '+os.environ['OPENROUTER_API_KEY']}
          with httpx.Client(base_url='https://openrouter.ai/api/v1/', headers=headers, timeout=90) as client:
              key_response = client.get('key')
              key_response.raise_for_status()
              data = key_response.json().get('data', {})
              remaining = data.get('limit_remaining')
              print(json.dumps({'key_authenticated': True, 'key_limit_exhausted': remaining is not None and remaining <= 0, 'free_tier': data.get('is_free_tier')}))
              for tokens in (256, 24576):
                  response = client.post('chat/completions', json={'model':'openai/gpt-6-astra', 'messages':[{'role':'user','content':'Return JSON: {"ok":true}'}], 'max_completion_tokens': tokens, 'response_format':{'type':'json_object'}, 'provider':{'allow_fallbacks':False}})
                  try:
                      error = str(response.json().get('error', {}).get('message', '')).lower()
                  except (ValueError, AttributeError):
                      error = ''
                  category = ('key_limit' if 'key' in error and 'limit' in error else 'insufficient_credits' if any(word in error for word in ('credit', 'balance', 'afford')) else 'payment_required' if response.status_code == 402 else 'other_error' if response.is_error else 'ok')
                  print(json.dumps({'probe_max_tokens':tokens, 'status':response.status_code, 'category':category}))
          PY
      - name: Verify configured model with one real JSON completion
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from horizon.openrouter_provider import OpenRouterProvider
          async def main():
              settings=json.loads(Path('configs/openrouter.example.json').read_text())
              settings.pop('provider')
              provider=OpenRouterProvider(approved=True, **settings)
              try:
                  reply=await provider.complete('Return exactly this JSON object: {"ok":true}')
                  assert json.loads(reply.text)=={'ok':True}, 'Model JSON check failed'
                  print(json.dumps({'model_completion':'ok','model':reply.model,'cost_eur':reply.cost_eur}))
              finally:
                  await provider.close()
          asyncio.run(main())
          PY
